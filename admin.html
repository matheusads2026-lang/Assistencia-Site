<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin | NexaTech Informática</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="admin-page">
    <header class="top">
      <a class="brand" href="index.html"
        ><span class="brandmark">N</span>Administração</a
      ><a href="index.html">← Voltar à loja</a>
    </header>
    <main class="admin-main">
      <div id="authBox" class="panel">
        <p class="eyebrow">ACESSO RESTRITO</p>
        <h1>Painel do proprietário</h1>
        <p>Entre com o e-mail e senha cadastrados no Supabase.</p>
        <form id="loginForm">
          <label
            >E-mail<input
              id="email"
              type="email"
              required
              autocomplete="username" /></label
          ><label
            >Senha<input
              id="password"
              type="password"
              required
              autocomplete="current-password" /></label
          ><button class="btn" type="submit">Entrar</button>
        </form>
        <p id="authMsg" class="msg"></p>
      </div>
      <div id="dashboard" hidden>
        <div class="dash-head">
          <div>
            <p class="eyebrow">CONTEÚDO DA LOJA</p>
            <h1>Gerenciar catálogo</h1>
          </div>
          <button id="logout" class="btn secondary">Sair</button>
        </div>
        <div class="tabs">
          <button class="tab active" data-type="produtos">Peças</button
          ><button class="tab" data-type="servicos">Serviços</button>
        </div>
        <form id="itemForm" class="panel editor">
          <input type="hidden" id="itemId" /><input
            type="hidden"
            id="itemType"
            value="produtos"
          />
          <h2 id="formTitle">Adicionar peça</h2>
          <div class="form-grid">
            <label>
              Nome
              <input id="itemName" required />
            </label>

            <div class="field-category">
              <label for="itemCategory"> Categoria </label>
              <input id="itemCategory" required placeholder="Ex.: Monitores" />
            </div>

            <div class="field-brand">
              <label for="itemBrand"> Marca </label>
              <input id="itemBrand" placeholder="Ex.: LG" />
            </div>

            <label>
              Preço (R$)
              <input
                id="itemPrice"
                type="number"
                min="0"
                step="0.01"
                required
              />
            </label>

            <label class="full">
              Descrição
              <textarea id="itemDescription" rows="3"></textarea>
            </label>

            <label class="full">
              Imagem
              <input id="itemImage" type="file" accept="image/*" />
            </label>
          </div>
          <div class="actions">
            <button class="btn" type="submit">Salvar</button
            ><button id="cancelEdit" class="btn secondary" type="button">
              Limpar
            </button>
          </div>
          <p id="saveMsg" class="msg"></p>
        </form>
        <div id="adminItems" class="admin-list"></div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
